# AI Agents Resources Configuration
resources:
  # Notebooks for agent deployment
  jobs:
    deploy_all_agents:
      name: "[${bundle.target}] Deploy RiskBricks AI Agents"
      
      tasks:
        - task_key: deploy_forecast_agent
          notebook_task:
            notebook_path: ../notebooks/agents/03_deploy_agent
            base_parameters:
              agent_type: forecast
              catalog: ${var.catalog}
              schema: ${var.schema}
              llm_endpoint: ${var.llm_endpoint}
          existing_cluster_id: ${var.cluster_id}
          
        - task_key: verify_forecast_agent
          depends_on:
            - task_key: deploy_forecast_agent
          notebook_task:
            notebook_path: ../notebooks/agents/02_create_agent
            base_parameters:
              agent_name: ${var.catalog}.${var.schema}.forecast_agent
          existing_cluster_id: ${var.cluster_id}
          
      # Job settings
      max_concurrent_runs: 1
      timeout_seconds: 3600
      
      # Email notifications
      email_notifications:
        on_success:
          - ${workspace.current_user.userName}
        on_failure:
          - ${workspace.current_user.userName}
          
      # Tags
      tags:
        environment: ${bundle.target}
        project: riskbricks
        component: ai_agents

  # Experiments for MLflow tracking
  experiments:
    forecast_agent_experiment:
      name: /Shared/riskbricks/experiments/${bundle.target}/forecast_agent
      
    risk_agent_experiment:
      name: /Shared/riskbricks/experiments/${bundle.target}/risk_agent
      
    decision_agent_experiment:
      name: /Shared/riskbricks/experiments/${bundle.target}/decision_agent
      
    supervisor_agent_experiment:
      name: /Shared/riskbricks/experiments/${bundle.target}/supervisor_agent

  # Model Serving endpoints (for registered models)
  model_serving_endpoints:
    forecast_agent_endpoint:
      name: ${bundle.target}_forecast_agent
      config:
        served_entities:
          - entity_name: ${var.catalog}.${var.schema}.forecast_agent
            entity_version: "1"
            scale_to_zero_enabled: true
            workload_size: Small
            
    risk_agent_endpoint:
      name: ${bundle.target}_risk_agent
      config:
        served_entities:
          - entity_name: ${var.catalog}.${var.schema}.risk_agent
            entity_version: "1"
            scale_to_zero_enabled: true
            workload_size: Small
            
    decision_agent_endpoint:
      name: ${bundle.target}_decision_agent
      config:
        served_entities:
          - entity_name: ${var.catalog}.${var.schema}.decision_agent
            entity_version: "1"
            scale_to_zero_enabled: true
            workload_size: Small
            
    supervisor_agent_endpoint:
      name: ${bundle.target}_supervisor_agent
      config:
        served_entities:
          - entity_name: ${var.catalog}.${var.schema}.supervisor
            entity_version: "1"
            scale_to_zero_enabled: true
            workload_size: Small
