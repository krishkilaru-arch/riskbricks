resources:
  jobs:
    riskbricks_stock_intraday_hourly:
      name: riskbricks_stock_intraday_hourly
      schedule:
        quartz_cron_expression: 0 0 * * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: gold_intraday_prices
          notebook_task:
            notebook_path: ${var.notebooks_path}/ingestion/stocks/bronze_to_gold_intraday_hourly
            source: WORKSPACE
          # cluster configured via bundle target
      queue:
        enabled: true
