resources:
  jobs:
    riskbricks_forecast_daily:
      name: riskbricks_forecast_daily
      schedule:
        quartz_cron_expression: 0 10 15 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: forecast
          notebook_task:
            notebook_path: /Workspace/Shared/RiskBricks/files/notebooks/agents/02_forecast_agent
            source: WORKSPACE
            base_parameters:
              symbol: "ALL"
              target_date: ""
              mode: "fast"
              models: "mean,gbm,ridge,news_event"
              train_days: "120"
              lstm_epochs: "2"
              xgb_estimators: "50"
              max_symbols: "0"
          environment_key: forecast_environment
      queue:
        enabled: true
      environments:
        - environment_key: forecast_environment
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
