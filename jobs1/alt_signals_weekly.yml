resources:
  jobs:
    riskbricks_alt_signals_weekly:
      name: riskbricks_alt_signals_weekly
      schedule:
        quartz_cron_expression: 0 0 8 ? * SUN
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: ingest_alt_signals_sec_fundamentals
          notebook_task:
            notebook_path: /Workspace/Shared/RiskBricks/files/notebooks/ingestion/alt_signals/ingest_alt_signals_sec
            source: WORKSPACE
            base_parameters:
              as_of_date: ""
              max_symbols: "0"
              sleep_seconds: "0.2"
              mode: "fundamentals"
          environment_key: alt_signals_environment
      queue:
        enabled: true
      environments:
        - environment_key: alt_signals_environment
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
