resources:
  jobs:
    riskbricks_evaluation_daily:
      name: riskbricks_evaluation_daily
      schedule:
        quartz_cron_expression: 0 30 16 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: evaluate_forecasts
          notebook_task:
            notebook_path: ${var.notebooks_path}/agents/99_evaluation_agent
            source: WORKSPACE
            base_parameters:
              symbol: "ALL"
              target_date: ""
          environment_key: evaluation_environment
      queue:
        enabled: true
      environments:
        - environment_key: evaluation_environment
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
