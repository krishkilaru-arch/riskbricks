resources:
  jobs:
    riskbricks_decision_daily:
      name: riskbricks_decision_daily
      schedule:
        quartz_cron_expression: 0 40 15 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: decision
          notebook_task:
            notebook_path: /Workspace/Shared/RiskBricks/files/notebooks/agents/06_decision_agent
            source: WORKSPACE
            base_parameters:
              as_of_date: ""
              lookback_news_days: "7"
              signal_threshold: "0.02"
          environment_key: decision_environment
      queue:
        enabled: true
      environments:
        - environment_key: decision_environment
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
