resources:
  jobs:
    riskbricks_portfolio_outputs_daily:
      name: riskbricks_portfolio_outputs_daily
      schedule:
        quartz_cron_expression: 0 50 15 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: portfolio_outputs
          notebook_task:
            notebook_path: /Workspace/Shared/RiskBricks/files/notebooks/agents/07_portfolio_outputs_agent
            source: WORKSPACE
            base_parameters:
              as_of_date: ""
          environment_key: portfolio_environment
      queue:
        enabled: true
      environments:
        - environment_key: portfolio_environment
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
