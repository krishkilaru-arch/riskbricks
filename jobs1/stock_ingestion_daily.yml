resources:
  jobs:
    riskbricks_stock_ingestion_daily:
      name: riskbricks_stock_ingestion_daily
      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: bronze_ingest_stocks_macros
          notebook_task:
            notebook_path: ${var.notebooks_path}/00_bronze/ingest_stocks_and_macros_data
            source: WORKSPACE
            base_parameters:
              start_date: ""
              end_date: ""
              stock_picker: ""
          new_cluster:
            num_workers: 0
            spark_version: 14.3.x-scala2.12
            node_type_id: i3.xlarge
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode
      queue:
        enabled: true
      run_as:
        user_name: ${var.run_as_user}
