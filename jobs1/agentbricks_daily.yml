resources:
  jobs:
    riskbricks_agentbricks_daily:
      name: riskbricks_agentbricks_daily
      schedule:
        quartz_cron_expression: 0 0 15 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: agentbricks_supervisor
          notebook_task:
            notebook_path: /Workspace/Shared/RiskBricks/files/notebooks/agents/00_supervisor
            source: WORKSPACE
            base_parameters:
              symbol: "ALL"
              as_of_date: ""
              target_date: ""
          environment_key: agentbricks_environment
      queue:
        enabled: true
      environments:
        - environment_key: agentbricks_environment
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
