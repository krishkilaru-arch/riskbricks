resources:
  jobs:
    riskbricks_gdelt_ingestion_daily:
      name: riskbricks_gdelt_ingestion_daily
      schedule:
        quartz_cron_expression: 0 0 7 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: bronze_ingest_gdelt
          notebook_task:
            notebook_path: ${var.notebooks_path}/ingestion/gdelt/bronze_ingest_gdelt
            source: WORKSPACE
          # cluster configured via bundle target
        - task_key: gold_load_gdelt_rag_corpus
          depends_on:
            - task_key: bronze_ingest_gdelt
          notebook_task:
            notebook_path: ${var.notebooks_path}/ingestion/gdelt/gold_load_gdelt_rag_corpus
            source: WORKSPACE
          # cluster configured via bundle target
      queue:
        enabled: true
      run_as:
        user_name: ${var.run_as_user}
