resources:
  jobs:
    riskbricks_news_analytics_daily:
      name: riskbricks_news_analytics_daily
      schedule:
        quartz_cron_expression: 0 50 14 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: news_analytics
          notebook_task:
            notebook_path: ${var.notebooks_path}/agents/05_news_analytics_agent
            source: WORKSPACE
            base_parameters:
              as_of_date: ""
          environment_key: news_analytics_environment
      queue:
        enabled: true
      environments:
        - environment_key: news_analytics_environment
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
