resources:
  jobs:
    riskbricks_factor_exposure_daily:
      name: riskbricks_factor_exposure_daily
      schedule:
        quartz_cron_expression: 0 30 15 * * ?
        timezone_id: America/New_York
        pause_status: UNPAUSED
      tasks:
        - task_key: factor_exposure
          notebook_task:
            notebook_path: ${var.notebooks_path}/agents/04_factor_exposure_agent
            source: WORKSPACE
            base_parameters:
              start_date: "2025-01-01"
              end_date: ""
          environment_key: factor_environment
      queue:
        enabled: true
      environments:
        - environment_key: factor_environment
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
